# Cell v2. laser_arm: KDL (Jacobian, deterministic) for compute_ik / Cartesian steps from a seed. The spike sweep
# enumerates all 8 IK branches with ur-analytic-ik in awm_path (ADR-12), not with this plugin.
laser_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
