openapi: 3.1.0
info:
  title: APLSMN601 awm_api — Sim-1 subset
  version: 1.0.0-draft
  description: >
    Contract freeze T0.5 (draft for Truong's review, 2026-11-04). Sim-1 endpoints only (PLAN.md T3.1); DES-001 Rev 0.6
    §7.3 / §7.4. All lengths mm, angles degrees (ADR-14). Job documents follow the v2 JSON schemas in
    src/awm_core/awm_core/schemas/v2 (named "v2/<name>" below); the D20 files follow
    docs/generated/contracts/D20_view_model.md. Errors are RFC 9457 problem details. The browser never reaches ROS;
    awm_api runs the engineering CLIs as subprocesses (B-11), one planning run per cell at a time.
    Progress is polled through /runs/{run_id} or pushed over the run WebSocket (x-awm-websockets, G1.4); the cell
    status WebSocket comes with S6 (WP4). Updated 2026-11-06 by the web agent (G1.6) to what the server serves: plan
    travel speed, program runs, S4 simulation payload, placement PUT, robot description + meshes, SeamPick D04 2.1
    fields, JobDetail fields. Updated 2026-11-07 by the web agent (G1.18, CP-62): /jobs/{job_id}/check/override, plan
    collision field, cell model head.tcp. Paths marked x-awm-implemented false are contract only (not served yet).
x-awm-websockets:
  /runs/{run_id}/ws:
    description: >
      Run progress push (G1.4). Query parameter token = bearer token. Sends the Run document on every change (≤ 10 Hz)
      until the run ends, then closes. Close code 4401 = token unknown, 4404 = run unknown. Display only.
servers:
  - url: /api/v1
security:
  - bearer: []
tags:
  - name: auth
  - name: jobs
  - name: runs
  - name: cell
paths:
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: Log in; returns a bearer token with the user's role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: {type: string, minLength: 1}
                password: {type: string, minLength: 1}
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                required: [token, role, expires_at, username]
                properties:
                  token: {type: string}
                  username: {type: string}
                  role: {$ref: '#/components/schemas/Role'}
                  expires_at: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Problem'}
  /jobs:
    get:
      tags: [jobs]
      summary: List jobs (all roles; Operator read-only)
      responses:
        '200':
          description: Job list
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/JobSummary'}
        '401': {$ref: '#/components/responses/Problem'}
    post:
      tags: [jobs]
      summary: Create a job from a STEP upload (Engineer). Runs import + D20 export (A11–A14) as one run.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [step, part_no, part_rev]
              properties:
                step: {type: string, format: binary, description: STEP AP203 / 214 / 242; stored as model.step}
                part_no: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'}
                part_rev: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'}
                component: {type: string, description: assembly component; omitted = whole file (part.json source.component)}
                up_axis: {type: string, enum: ['+X', '-X', '+Y', '-Y', '+Z', '-Z'], default: '+Z'}
      responses:
        '202': {$ref: '#/components/responses/RunStarted'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /jobs/{job_id}:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      tags: [jobs]
      summary: Job detail (status, documents present with their SHA-256, program revisions, active pointers)
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobDetail'}
        '404': {$ref: '#/components/responses/Problem'}
  /jobs/{job_id}/view/{file}:
    parameters:
      - {$ref: '#/components/parameters/JobId'}
      - name: file
        in: path
        required: true
        schema: {type: string, enum: [view.glb, topology.json]}
    get:
      tags: [jobs]
      summary: D20 view model files (all roles)
      responses:
        '200':
          description: File content
          content:
            model/gltf-binary: {}
            application/json: {}
        '404': {$ref: '#/components/responses/Problem'}
  /jobs/{job_id}/seams:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      tags: [jobs]
      summary: Seam list D04 (document v2/seams)
      responses:
        '200': {description: v2/seams document, content: {application/json: {}}}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      tags: [jobs]
      summary: Replace the seam list from picked ids + attributes (Engineer). M2 resolves the ids against the B-Rep and returns the full v2/seams document.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [seams]
              properties:
                seams:
                  type: array
                  items: {$ref: '#/components/schemas/SeamPick'}
      responses:
        '200':
          description: v2/seams document as stored (seam_axis.json rebuilt when the job has a placement)
          headers:
            X-AWM-Seam-Axis: {schema: {type: string}, description: 'built, or "not built: …" without placement.json'}
          content: {application/json: {}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem', description: 'run-busy, roles-missing, cad-check-missing, cad-check-stale, cad-check-red, cad-check-override-void, cad-check-override-invalid (CP-60 / CP-62 gate, evaluated again inside the run slot)'}
        '422': {$ref: '#/components/responses/Problem', description: 'field errors with pointers, or the seam CLI refusal'}
  /jobs/{job_id}/placement:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      tags: [jobs]
      summary: Placement + scene manifest D19 (document v2/placement); mesh files under /jobs/{job_id}/files/{path}
      responses:
        '200': {description: v2/placement document, content: {application/json: {}}}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      tags: [jobs]
      summary: >
        Placement for a job made in the browser (Engineer, G1.6): a manual pose of the part in positioner_flange or a
        copy of another job's flange_T_part. Written as v2/placement with source study, verified false, Assumption in
        created_by; the part object uses the D20 view.glb as its mesh (not a collision mesh, Goal 1). seam_axis.json
        and path.json become stale (header X-AWM-Seam-Axis carries the new seam_axis state).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: exactly one of flange_T_part or copy_from
              properties:
                flange_T_part:
                  type: object
                  additionalProperties: false
                  required: [position_mm]
                  description: exactly one of rpy_deg (URDF convention R = Rz(yaw)·Ry(pitch)·Rx(roll)) or quat_xyzw
                  properties:
                    position_mm: {type: array, items: {type: number, minimum: -5000, maximum: 5000}, minItems: 3, maxItems: 3}
                    rpy_deg: {type: array, items: {type: number}, minItems: 3, maxItems: 3}
                    quat_xyzw: {type: array, items: {type: number}, minItems: 4, maxItems: 4, description: normalised by the server}
                copy_from: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*_[A-Za-z0-9][A-Za-z0-9._-]*$'}
      responses:
        '200':
          description: v2/placement document as stored
          headers:
            X-AWM-Seam-Axis: {schema: {type: string, enum: [missing, ok, stale]}}
          content: {application/json: {}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem', description: 'no-view, no-placement (copy source), run-busy'}
        '422': {$ref: '#/components/responses/Problem'}
  /jobs/{job_id}/files/{path}:
    parameters:
      - {$ref: '#/components/parameters/JobId'}
      - name: path
        in: path
        required: true
        description: job-relative path of a file referenced by a job document (meshes); no traversal outside the job
        schema: {type: string}
    get:
      tags: [jobs]
      summary: Read-only job file referenced by a document (e.g. cache/collision.stl)
      responses:
        '200': {description: File content}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /jobs/{job_id}/plan:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      tags: [jobs, runs]
      summary: Start a planning run (M4; Engineer). One run per cell; the run is the job lock (B-11).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                seams: {type: array, items: {type: string, pattern: '^S[0-9]{2,3}$'}, description: subset; default all}
                travel_speed_mm_s:
                  type: number
                  exclusiveMinimum: 0
                  description: >
                    WPS travel speed relative to the part, entered by the Engineer (CP-59 follow-up 2026-11-06);
                    absent = planner default (Assumption, recorded in D07 planner.params). Passed to the planner as
                    --travel-speed-mm-s. Never slowed down silently: D07 reports max_travel_speed_mm_s per arc and the
                    program step refuses a speed above it.
                collision:
                  type: string
                  enum: ['off', 'on']
                  default: 'off'
                  description: >
                    Goal 1 plans kinematic only (CP-58, D07 collision_checked false); 'on' is refused with 409
                    collision-unavailable (Goal 2), or with cad-check-override-kinematic-only when a CP-62 override of
                    check 4 is what lets the job plan. With a valid override the run writes D07 cad_check_override
                    {file, sha256, cad_check_sha256, check_id 4}; the program run carries it into D09.
      responses:
        '202': {$ref: '#/components/responses/RunStarted'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem', description: 'no-seams, no-placement, seam-axis-missing, seam-axis-stale, run-busy, roles-missing, cad-check-missing, cad-check-stale, cad-check-red, cad-check-override-void, cad-check-override-invalid, cad-check-override-kinematic-only, collision-unavailable'}
        '422': {$ref: '#/components/responses/Problem'}
  /jobs/{job_id}/program:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      tags: [jobs, runs]
      summary: >
        Start a program run (M6, G1.5 CLI `generate --job`; Engineer). Needs a current path.json. The CLI writes
        programs/P###/program.json (D09) itself; the run outputs name it. A refusal (e.g. travel speed above the
        feasible maximum) fails the run with the CLI reason in problem.detail.
      requestBody:
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '202': {$ref: '#/components/responses/RunStarted'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem', description: 'no-path, path-stale, run-busy'}
  /runs/{run_id}:
    parameters:
      - name: run_id
        in: path
        required: true
        schema: {type: string, pattern: '^R[0-9]{8}T[0-9]{6}Z-[0-9a-f]{6}$'}
    get:
      tags: [runs]
      summary: Run status and progress (poll ≤ 1 Hz)
      responses:
        '200':
          description: Run status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [runs]
      summary: Cancel a run (SIGTERM to the subprocess; outputs of a cancelled run are never promoted)
      responses:
        '202': {description: Cancel requested}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /jobs/{job_id}/simulation:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      tags: [jobs]
      summary: >
        Playback data for S4 (all roles, display only): the newest current program (D09) when one exists, else the
        path timing (D07); always the path (per-point status, TCP poses in the part frame), placement (D19) and seams
        (D04). A program whose input hashes no longer match (path re-planned) is not played (program_state stale).
      responses:
        '200':
          description: Playback data
          content:
            application/json:
              schema:
                type: object
                required: [job_id, source, program_rev, program_state, program, path, path_state, placement, seams,
                           collision_checked, view_url, robot_description_url, notes]
                properties:
                  job_id: {type: string}
                  source: {type: string, enum: [program, path], description: what the timeline is built from}
                  program_rev: {type: [string, 'null'], pattern: '^P[0-9]{3}$'}
                  program_state: {type: [string, 'null'], enum: [ok, stale, null]}
                  program: {description: 'v2/program document (2.0 or 2.1) or null'}
                  path: {description: 'v2/path document or null (a v1 path is not playable)'}
                  path_state: {type: string, enum: [ok, stale, missing]}
                  placement: {description: v2/placement document}
                  seams: {description: 'v2/seams document or null'}
                  collision_checked: {type: boolean, description: 'true only when every played document says true; false = show "Kinematic only — collision not checked" (CP-58)'}
                  view_url: {type: string}
                  robot_description_url: {type: string}
                  notes: {type: array, items: {type: string}}
        '404': {$ref: '#/components/responses/Problem'}
  /cell/robot_description:
    get:
      tags: [cell]
      summary: >
        Cell URDF for the browser (all roles, display only): rendered like the planner
        (awm_path.description.load_planning_description, head_model hcad, pose arguments from cell/model/frames.yaml),
        in metres / radians (URDF, REP 103). Mesh URIs rewritten to /api/v1/cell/meshes/…; cached by the SHA-256 of
        frames.yaml and head.yaml.
      responses:
        '200':
          description: Description
          content:
            application/json:
              schema:
                type: object
                required: [urdf, head_model, unit]
                properties:
                  urdf: {type: string}
                  head_model: {type: string, const: hcad}
                  unit: {type: string}
                  frames_sha256: {type: string}
                  head_yaml_sha256: {type: string}
                  note: {type: string}
        '409': {$ref: '#/components/responses/Problem', description: no-cell-model (frames.yaml or head folder missing)}
        '500': {$ref: '#/components/responses/Problem', description: description-failed}
  /cell/meshes/head/{path}:
    parameters:
      - {name: path, in: path, required: true, schema: {type: string}, description: 'file below the H-CAD head folder'}
    get:
      tags: [cell]
      summary: Read-only head mesh (stl / dae / obj / glb / gltf / png / jpg); no traversal, no symlink leaving the folder
      responses:
        '200': {description: File content, content: {application/octet-stream: {}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /cell/meshes/package/{package}/{path}:
    parameters:
      - {name: package, in: path, required: true, schema: {type: string}, description: 'a package named by the rendered URDF'}
      - {name: path, in: path, required: true, schema: {type: string}}
    get:
      tags: [cell]
      summary: Read-only mesh from the share folder of a package referenced by the description (e.g. ur_description)
      responses:
        '200': {description: File content, content: {application/octet-stream: {}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /cell/model:
    get:
      tags: [cell]
      summary: >
        S10 cell model status (CP-60) - cell STEP, up axis, roles / axis pick state, saved model, head files
        (head.step, cad_map_head.yaml, head.yaml) and head.tcp (CP-61: tool0_T_tcp xyz_mm / quat_xyzw, beam_axis_tool0,
        method, taught_by / taught_at, edge, stick-out; null without head.yaml), stale jobs
      responses:
        '200': {description: status, content: {application/json: {}}}
    post:
      tags: [cell]
      summary: Admin - upload the cell STEP assembly + up axis; run inspect-assembly + export-cell-view into cell/cad
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [step, up_axis]
              properties:
                step: {type: string, format: binary}
                up_axis: {type: string, enum: ['+X', '-X', '+Y', '-Y', '+Z', '-Z']}
      responses:
        '202': {description: 'run started: {run_id} (+ key for a view); Location /api/v1/runs/{run_id}', content: {application/json: {}}}
        '403': {$ref: '#/components/responses/Problem'}
  /cell/model/files/{name}:
    parameters: [{name: name, in: path, required: true, schema: {type: string, enum: [cell_components.json, cell_view.glb, roles.json, axis_pick.json, cell_meta.json]}}]
    get:
      tags: [cell]
      summary: Cell CAD files of S10 (read)
      responses:
        '200': {description: File content, content: {application/octet-stream: {}}}
        '404': {$ref: '#/components/responses/Problem'}
  /cell/model/roles:
    get:
      tags: [cell]
      summary: Cell roles (v2/cad_roles assignments) or the template pre-fill (prefilled true)
      responses:
        '200': {description: '{assignments, prefilled, collision, contact_tolerance_mm}', content: {application/json: {}}}
    put:
      tags: [cell]
      summary: Admin - save the cell roles (robot, tool, rotary_fixture, static, exclude; CP-60); 422 lists the problems; updates cell/roles_template.json
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [assignments], properties: {assignments: {type: array}, collision: {type: object}, contact_tolerance_mm: {type: number, minimum: 0}}}}}
      responses:
        '200': {description: v2/cad_roles document, content: {application/json: {}}}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /cell/model/component_view:
    post:
      tags: [cell]
      summary: Admin - D20 edge view of one cell component (for the positioner-axis circle pick)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [component_path], properties: {component_path: {type: string}}}}}
      responses:
        '202': {description: 'run started: {run_id} (+ key for a view); Location /api/v1/runs/{run_id}', content: {application/json: {}}}
        '403': {$ref: '#/components/responses/Problem'}
  /cell/model/views/{key}/{file}:
    parameters:
      - {name: key, in: path, required: true, schema: {type: string, pattern: '^[0-9a-f]{12}$'}}
      - {name: file, in: path, required: true, schema: {type: string, enum: [view.glb, topology.json]}}
    get:
      tags: [cell]
      summary: A component edge view exported by component_view or /cell/head/view
      responses:
        '200': {description: File content, content: {application/octet-stream: {}}}
        '404': {$ref: '#/components/responses/Problem'}
  /cell/model/axis:
    put:
      tags: [cell]
      summary: Admin - positioner axis from a circular edge of a component view (pick-circle -> cell/cad/axis_pick.json); theta 0 = pose in the file
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [component_path, edge_id], properties: {component_path: {type: string}, edge_id: {type: string, pattern: '^E[0-9]+$'}, reverse: {type: boolean}}}}}
      responses:
        '202': {description: 'run started: {run_id} (+ key for a view); Location /api/v1/runs/{run_id}', content: {application/json: {}}}
        '403': {$ref: '#/components/responses/Problem'}
  /cell/model/save:
    post:
      tags: [cell]
      summary: Admin - apply-roles + export-scene without a job (cell/model); jobs planned on the old cell become stale
      responses:
        '202': {description: 'run started: {run_id} (+ key for a view); Location /api/v1/runs/{run_id}', content: {application/json: {}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /cell/head/view:
    post:
      tags: [cell]
      summary: Admin - D20 edge view of a component of cell/cad/head.step (Tool / TCP tab, CP-61)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [component], properties: {component: {type: string}}}}}
      responses:
        '202': {description: 'run started: {run_id} (+ key for a view); Location /api/v1/runs/{run_id}', content: {application/json: {}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /cell/head/tcp:
    put:
      tags: [cell]
      summary: Admin - teach tcp_laser from the nozzle-mouth circle (export-head --tcp-edge; stick-out mm along the beam, CP-61)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [component, edge_id], properties: {component: {type: string}, edge_id: {type: string}, reverse: {type: boolean}, stickout_mm: {type: number, minimum: 0, maximum: 50}}}}}
      responses:
        '202': {description: 'run started: {run_id} (+ key for a view); Location /api/v1/runs/{run_id}', content: {application/json: {}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /jobs/{job_id}/roles:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      tags: [jobs]
      summary: Job roles (v2/cad_roles assignments) or the template pre-fill
      responses:
        '200': {description: '{assignments, prefilled}', content: {application/json: {}}}
    put:
      tags: [jobs]
      summary: Engineer - save the job roles (part, rotary_fixture, ...; CP-60); 422 lists the problems; makes the cross-check stale
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [assignments], properties: {assignments: {type: array}}}}}
      responses:
        '200': {description: v2/cad_roles document, content: {application/json: {}}}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /jobs/{job_id}/axis:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    put:
      tags: [jobs]
      summary: Engineer - positioner axis picked on the job file (pick-circle --components -> axis_pick.json)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [edge_id], properties: {edge_id: {type: string, pattern: '^E[0-9]+$'}, reverse: {type: boolean}}}}}
      responses:
        '202': {description: 'run started: {run_id} (+ key for a view); Location /api/v1/runs/{run_id}', content: {application/json: {}}}
        '403': {$ref: '#/components/responses/Problem'}
  /jobs/{job_id}/check:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      tags: [jobs]
      summary: CAD cross-check (v2/cad_check) and its state ok / stale
      responses:
        '200': {description: '{state, check}', content: {application/json: {}}}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      tags: [jobs]
      summary: Engineer - run job-placement (placement.json source job_cad + cad_check.json; 0.05 mm / 0.1 deg); red or stale blocks seams and Plan (409)
      responses:
        '202': {description: 'run started: {run_id} (+ key for a view); Location /api/v1/runs/{run_id}', content: {application/json: {}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /jobs/{job_id}/check/override:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      tags: [jobs]
      summary: >
        CP-62 override of cross-check 4 (all roles): {override (v2/cad_check_override), valid, problem}. valid false =
        void (the cross-check changed after it was recorded) or not matching the schema; 404 no-override.
      responses:
        '200': {description: '{override, valid, problem}', content: {application/json: {}}}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      tags: [jobs]
      summary: >
        Admin - record the override of check 4 for kinematic-only planning (CP-62): writes jobs/<job>/cad_check_override.json
        (by, reason, check-4 findings, SHA-256 of the current cad_check.json). Refused 409 override-not-applicable when
        check 4 is not red or another check is red; cad-check-stale / cad-check-missing; run-busy while a run is active.
        cad_check.json stays red; with a valid override seam saving and Plan with collision off pass the gate.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [reason], properties: {reason: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}}}}}
      responses:
        '201': {description: v2/cad_check_override document, content: {application/json: {}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [jobs]
      summary: Admin - remove the CP-62 override (seams and Plan are blocked again while check 4 is red)
      responses:
        '204': {description: removed}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /jobs/{job_id}/release:
    x-awm-implemented: false
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      tags: [jobs]
      summary: >
        Simulation-scope release of a verified program revision (Engineer; ADR-17). Production scope is not available
        in Sim-1. CP-62: a program whose D09 carries cad_check_override (kinematic only, collision_checked false) is
        refused in every scope (awm_verify release_gate), override or not, while check 4 is red.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [program_rev, scope]
              properties:
                program_rev: {type: string, pattern: '^P[0-9]{3}$'}
                scope: {type: string, const: simulation}
                note: {type: string}
      responses:
        '201': {description: v2/release document as locked, content: {application/json: {}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      description: <PartNo>_<PartRev>
      schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*_[A-Za-z0-9][A-Za-z0-9._-]*$'}
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RunStarted:
      description: Run accepted
      headers:
        Location: {schema: {type: string}, description: '/api/v1/runs/{run_id}'}
      content:
        application/json:
          schema:
            type: object
            required: [run_id]
            properties:
              run_id: {type: string}
  schemas:
    Role: {type: string, enum: [Operator, Engineer, Admin]}
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, description: 'URI reference, e.g. /problems/run-busy'}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        errors:
          type: array
          description: field-level errors (schema validation, unknown edge ids)
          items:
            type: object
            properties:
              pointer: {type: string}
              message: {type: string}
    JobSummary:
      type: object
      required: [job_id, part_no, part_rev, status, updated_at]
      properties:
        job_id: {type: string}
        part_no: {type: string}
        part_rev: {type: string}
        status: {type: string, enum: [importing, draft, planned, simulated, released_simulation, released_trial, released_production, error]}
        updated_at: {type: string, format: date-time}
    JobDetail:
      allOf:
        - {$ref: '#/components/schemas/JobSummary'}
        - type: object
          required: [documents, programs, active]
          properties:
            documents:
              type: object
              description: name → SHA-256 of part.json, seams.json, process.json, placement.json, path.json, cache/view/*
              additionalProperties: {type: string, pattern: '^[0-9a-f]{64}$'}
            programs: {type: array, items: {type: string, pattern: '^P[0-9]{3}$'}}
            active:
              type: object
              properties:
                simulation: {type: [string, 'null']}
                trial: {type: [string, 'null']}
                production: {type: [string, 'null']}
            active_run: {type: [string, 'null']}
            placement:
              oneOf:
                - {type: 'null'}
                - {type: object, properties: {source: {type: string, enum: [study, fixture_cad]}, verified: {type: boolean}}}
            placement_note: {type: [string, 'null'], description: why planning is not available without a placement}
            seam_axis: {type: string, enum: [missing, ok, stale], description: 'seam_axis.json by its input hashes (CP-58 d2)'}
            path: {type: string, enum: [missing, ok, stale], description: path.json by its input hashes}
            collision_checked: {type: boolean, const: false, description: 'Goal 1 (CP-58): nothing in this backend checks collision'}
    SeamPick:
      type: object
      additionalProperties: false
      required: [seam_id, edges, reversed, joint_type, sequence]
      properties:
        seam_id: {type: string, pattern: '^S[0-9]{2,3}$'}
        edges: {type: array, minItems: 1, items: {type: string, pattern: '^E[0-9]+$'}, description: picked edges; M2 chains tangent edges and maps a joint edge of either solid to its joint}
        reversed: {type: boolean}
        range_mm: {type: [array, 'null'], items: {type: number}, minItems: 2, maxItems: 2, description: 'reserved; refused with 422 in Goal 1 (D04 2.1 uses arcs, arc_overlap_mm and start_offset_mm)'}
        joint_type: {type: string, enum: [butt, fillet, lap, groove]}
        sequence: {type: integer, minimum: 1}
        leg_mm: {type: [number, 'null'], minimum: 0}
        arcs: {type: integer, minimum: 1, maximum: 12, default: 1, description: 'number of weld arcs entered by the Engineer (CP-53); equal lengths from the seam start'}
        arc_overlap_mm: {type: number, minimum: 0, default: 2.0, description: 'overlap between consecutive arcs and the 360° closing overlap; default 2 mm (Assumption until the WPS carries it)'}
        positioner_mode: {type: string, enum: [sync, C, B], default: sync, description: 'CP-59: sync = robot + positioner as 7 joints; C = robot at rest, positioner turns; B = fixed positioner angle per arc'}
        positioner_angles_deg: {type: [array, 'null'], items: {type: number}, description: 'mode B only: one angle per arc (B-12); refused otherwise'}
        start_offset_mm: {type: number, minimum: 0, default: 0, description: 'closed seams: start point along the joint edge from its first vertex'}
        note: {type: string}
    Run:
      type: object
      required: [run_id, job_id, kind, state, progress, started_at]
      properties:
        run_id: {type: string}
        job_id: {type: string}
        kind: {type: string, enum: [import, plan, program, verify]}
        state: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
        progress: {type: number, minimum: 0, maximum: 1}
        step: {type: string, description: human-readable current step}
        started_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        log_tail: {type: array, items: {type: string}, maxItems: 50}
        outputs:
          type: object
          description: job-relative output files of a succeeded run with SHA-256
          additionalProperties: {type: string, pattern: '^[0-9a-f]{64}$'}
        problem: {oneOf: [{$ref: '#/components/schemas/Problem'}, {type: 'null'}]}
