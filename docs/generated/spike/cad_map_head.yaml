# Role map of the Fusion head CAD for the H-CAD head model (WP-S S.5c Task 1). Data, not source (ADR-16, CP-23).
# Prepared by cad-geometry 2026-11-05 from inspect-assembly of docs/3D/Dau_han_robot.step (13 nodes, 29 solids).
# No REF_* markers (OI-23): tool0 is estimated from the geometry (lead proposal (a), 2026-11-05), an Assumption until
# Truong confirms; it can be replaced here (frames.tool0: origin_file_mm + z_file + x_file, file mm), then recorded as
# method: map. tcp_laser is set explicitly (frames.tcp point_file_mm + axis_file): the automatic beam estimate took the
# fiber / cable connector end behind the flange (bug of 2026-11-06) and is now refused by export-head.
# Not yet valid against v2/cad_map.schema.json (requires the cell frames, has no head_links / head frames):
# awm_geometry export-head checks this file itself; schema extension requested from the contract owner.
schema: cad_map/0.1
source:
  file: docs/3D/Dau_han_robot.step
  sha256: a06e294c7f7af50da170130e24f7fbcd74049f40b1abba8bee1c98b7ee68e4bc
  unit: mm
  up_axis: +Y            # robot base near file y 0, arm along +Y (Fusion Y-up, as the cell CAD); not used by the
                         # head export (all outputs in tool0)
match: instance_name     # names are matched against the instance name of each node; never split paths on '/'
default: deny            # any component with geometry not covered (by itself or by an ancestor) is an error

roles:
  head_cad:
    - path: 'ASSY, Welding tool:1'
      depth: 1                         # LightWELD head + mount, child of the posed robot 'UR5E/UR7E'
  ignore:                              # robot geometry always from ur_description (ADR-16)
    - 'C-1000257:1'                    # base (19 solids)
    - 'C-1000248:1'                    # shoulder
    - 'C-1000249:1'                    # upper arm
    - 'C-1000250:1'                    # forearm
    - 'C-1000251:1'                    # wrist 1
    - 'C-2007861:1'                    # wrist 2 (78.7 x 120.5 x 119.1 mm)
    - 'C-2007038:1'                    # wrist 3 with the ISO 9409-1-50-4-M6 flange (used for tool0 only)

head_links:                            # URDF link -> instance names below the head component (default deny)
  head_body:
    - 'LightWELD:1'                    # surface model (COMPOUND, 0 solids) + one small solid (wire-feed part)
  head_mount:
    - 'Tool for LightWELD:1'           # mount, 1 solid, bolted to the flange

frames:
  tool0:
    robot_link: 'C-2007038:1'          # flange face of wrist 3 touches the mount (coplanar faces)
    mount: 'Tool for LightWELD:1'
    pin_radius_mm: 3.0                 # Ø6 dowel-pin hole of the flange
    pin_axis: '-Y'                     # ur_description ur5e wrist3 mesh: pin hole (r 25 mm) and tool connector at
                                       # tool0 -Y (read 2026-11-05 from the mesh in awm_dev)
  tcp:
    beam_link: head_body
    nozzle_len_mm: 40.0                # parametric collision nozzle Ø20 x 40 (CP-56; I2 / OI-15), ending at the TCP:
                                       # beam exit = TCP - 40 mm along the beam
    # nozzle tip on the barrel axis, located 2026-11-06 from Truong's mark; stick-out 0 (DES-001 §5.3, focus offset
    # default 0); replace by UI teach (CP-61). File frame, mm; in tool0: (43.829, 0.000, 279.606), beam (0.86602, 0,
    # 0.50001) = 60 deg from the flange axis (end of the slanted barrel, 162 revolved faces, r 3.65...19 mm).
    point_file_mm: [-133.3, 128.657051, 703.671505]   # TCP = nozzle tip + stick-out 0
    axis_file: [0.0, -0.844210028, -0.536012527]      # beam direction out of the nozzle (unit)
