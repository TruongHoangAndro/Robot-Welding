# TST-002 G2 pose set (WP-S S.4 C4) — generated once with the design oracle; edit only with a new log.
schema: awm_g2_poses/0.1
note: 'TST-002 Rev 0.3 G2 pose set for the spike scene (WP-S S.4 C4). Data, not source. Job 564082_A, cell scene of export-scene
  (scene decisions D1-D10). World = cell CAD frame rotated Z up, origin at the UR base (Assumption, OI-23). Built with an
  independent numpy design oracle (head H-BOX primitives at the xacro defaults vs the scene meshes: exact point-triangle distances
  from 1-5 mm surface samples + winding-number inside test; arm = capsules r 80 mm on the UR DH polyline); its numbers are
  stored per pose under `oracle`. Free poses: every head link >= 5 mm except the nozzle at the contact standoff, arm capsules
  clear. Colliding poses: tcp or nozzle inside the named object. The oracle does not use MoveIt / FCL. Label rule (run 2):
  among the IK solutions whose arm capsules are clear, the one with the largest approximate head-to-arm distance (head samples
  vs shoulder / upper-arm / forearm axis lines; `label_rule_self_mm`); run 1 took the first label and F06 met a head-arm self-collision
  the oracle does not model (g2_log_run1).'
